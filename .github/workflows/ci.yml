name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,plugin]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Audit source-grounded canonical mattress methods
        run: python scripts/audit_canonical_empirical.py
      - name: Build portable Codex and Claude plugin archive
        run: python scripts/build_plugin.py
      - name: Verify distributable wheel contains executable runtime
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python - <<'PY'
          import glob
          import zipfile
          from pathlib import Path

          wheels = glob.glob(str(Path(__import__("os").environ["RUNNER_TEMP"]) / "wheels" / "*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              contents = set(archive.namelist())
          required = {
              "simulation/core.py",
              "simulation/mechanism_map.py",
              "simulation/schemas/planning-handoff.schema.json",
              "plugin_runtime/server.py",
              "plugin_runtime/operations.py",
              "scripts/checkpoint_validation.py",
              "schemas/checkpoint.schema.json",
          }
          missing = sorted(required - contents)
          assert not missing, f"Wheel is missing production runtime files: {missing}"
          PY
          python -m pip install --no-deps --target "$RUNNER_TEMP/installed" "$RUNNER_TEMP"/wheels/*.whl
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          installed = Path(os.environ["RUNNER_TEMP"]) / "installed"
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          os.chdir(os.environ["RUNNER_TEMP"])
          sys.path.insert(0, str(installed))
          import plugin_runtime.operations as operations
          import simulation.core as core
          import scripts.checkpoint_validation as checker

          for module in (operations, core, checker):
              assert Path(module.__file__).is_relative_to(installed), module.__file__
          payload = (workspace / "examples/canonical-mattress/results/CHECKPOINT.json").read_text()
          result = operations.checkpoint_summary(payload)
          assert result["valid"] and result["evidence_rows"] == 28
          assert (installed / "simulation/schemas/planning-handoff.schema.json").is_file()
          assert (installed / "schemas/checkpoint.schema.json").is_file()
          print("Standalone wheel validated from outside checkout")
          PY


  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build private MCP container
        run: docker build --tag sida-mcp-audit .
      - name: Import runtime inside non-root production image
        run: |
          docker run --rm --entrypoint python sida-mcp-audit -c '
          import os
          from plugin_runtime.server import BearerGuard, mcp
          from plugin_runtime.operations import run_study_pipeline
          assert os.getuid() != 0
          assert mcp.name == "Scaled Interview Data Assistant"
          assert callable(run_study_pipeline)
          print("Container runtime imported with non-root identity")
          '
