[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scaled-interview-data-assistant"
version = "1.1.0"
description = "Evidence-traceable JTBD/A2B interview synthesis methods and deterministic helpers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Matt Lane" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "typer>=0.9,<1",
  "rich>=13.0,<16",
  "pyyaml>=6.0,<7",
  "openpyxl>=3.1,<4",
  "jsonschema>=4.22,<5"
]

[project.urls]
Repository = "https://github.com/mattlane66/scaled-interview-data-assistant"

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<10",
  "ruff>=0.4,<1"
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Typer declares CLI options in function defaults by design.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
